# dsh-container SERVER MODE — web profile overlay (seeded once on first boot).
#
# The harness's directory-picker seam ships `-auto`, which resolves at boot
# whether to mount the OS chooser (`native`, needs the host display + zenity/
# kdialog) or the in-app browser (`browse`, listing + create over HTTP).
#
# On a server no operator can ever reach a host display, so we PIN `browse`
# here: the "Select Workspace Directory" dialog becomes the in-app file
# browser, which works for remote clients (it is a normal HTTP dialog — list,
# browse, type a path, create a folder — with no native component at all). It
# is also what `-auto` would resolve to in this headless image; pinning makes
# it deterministic and keeps a later image change (e.g. a shipped desktop
# picker) from ever opening a dialog on an unattended server.
#
# The patch engine refuses to change a row's package `name` (a row's module
# identity is structural), so this layer disables the stock `-auto` row and
# mounts the `-browse` backend as a new row instead. Its browser half loads
# automatically (the seam's one-row-swaps-both-faces rule). This file was
# written by the container entrypoint because DSH_SERVER_MODE=1; delete it (or
# edit it) to change the behavior.
- id: directory-picker
  disabled: true
- insert:
    - id: directory-picker-browse
      name: '@deepseek-ai/dsh-host-directory-picker-browse'
