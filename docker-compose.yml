# DeepSeek Harness — run the web GUI with Docker. LOCAL MODE.
#
# This stack is for working locally on this machine: the harness data and the
# agent's workspace are mounted from host directories (or private volumes when
# you don't set them), and the GUI is published on 127.0.0.1 only — nothing on
# your network can reach it, by default.
#
# For a SERVER the machine runs on 24/7 and is accessed remotely, use
# docker-compose.server.yml instead (or the installer's `server` command):
# persistent volumes for harness data AND workspaces, LAN access by default.
#
#   1. (optional) cp .env.example .env   and put your API key in it
#   2. docker compose up -d
#   3. open http://localhost:3080
#
# Everything below has a working default: `docker compose up -d` alone pulls
# the published image, creates the two volumes, and serves the GUI. Nothing in
# this file needs editing — the settings people usually change are environment
# variables you can put in a `.env` file next to this one (see .env.example):
#
#   DEEPSEEK_API_KEY   your provider key (or set it later in the GUI Settings)
#   DSH_WEB_PORT       port on YOUR machine to open the GUI on   (default 3080;
#                      also what the startup banner prints)
#   DSH_BIND_ADDRESS   the address the GUI is published on. Default 127.0.0.1
#                      = this machine only; set it to 0.0.0.0 for LAN access
#   DSH_HOME_DIR       host folder for the harness data (settings, credentials,
#                      history, plugins), e.g. ~/.dsh to share with a native
#                      dsh install (default: the private `dsh-home` volume)
#   DSH_WORKSPACE_DIR  host folder the agent works in, e.g. ./my-project
#                      (default: the private `dsh-workspace` volume)
#   DSH_TAG            image version to run                      (default latest)
#
# The quickest local setup is the installer — it downloads this file into
# ~/.dsh-container and writes the settings for you:
#   curl -LsSf https://raw.githubusercontent.com/AndreasSeidl/dsh-docker/main/scripts/install.sh | sh -s -- local
#
# Ports: the GUI is served on 3080, the port the harness's own docs use, so
# anything written for upstream applies here. (`dsh web` itself runs behind the
# bundled proxy on an internal port; you never see or set it.)
#
# Heads-up: there is NO authentication. Out of the box the port is published on
# 127.0.0.1, so the kernel only accepts connections from this machine — nothing
# on your network can reach it at all. Setting DSH_BIND_ADDRESS=0.0.0.0 opens it
# to everyone who can reach this host on that port, so do that only for a
# network you trust.
#
# Stop with `docker compose down` (your data is kept) or `docker compose down -v`
# (deletes the volumes and everything on them).

services:
  dsh:
    image: ${DSH_IMAGE:-ghcr.io/andreasseidl/dsh-docker:${DSH_TAG:-latest}}
    container_name: dsh
    restart: unless-stopped

    # <publish address>:<host port>:<the GUI inside the container>.
    # The publish address IS the access control: 127.0.0.1 (default) means the
    # kernel never accepts a connection from anywhere but this machine.
    #
    # Set DSH_BIND_ADDRESS=0.0.0.0 for LAN access. It is an address, not an
    # on/off flag — `=1` fails with "invalid IP address: 1". (It has to work
    # this way: compose can only test whether a variable is set, not what it
    # holds, and keying on set/unset would make "unset" mean "published on
    # every interface" — the wrong default for a GUI with no login.)
    ports:
      - "${DSH_BIND_ADDRESS:-127.0.0.1}:${DSH_WEB_PORT:-3080}:3080"

    environment:
      # Your provider key. Set it in .env (or your shell) — or leave it empty
      # and add the key on the GUI's Settings page after first boot.
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
      DEEPSEEK_BASE_URL: "${DEEPSEEK_BASE_URL:-}"

      # The host port you publish on, passed through so the startup banner
      # prints the URL you will actually use (http://localhost:DSH_WEB_PORT).
      DSH_WEB_PORT: "${DSH_WEB_PORT:-3080}"

      # DSH_WEB_AUTH_MODE=trust-proxy makes the bundled proxy exchange the
      # per-run session token itself (no 401/token dance for clients). Set it
      # ONLY when a real access layer sits in front of this container (TLS+auth
      # edge, VPN, tsdproxy/Tailscale); on a plain 0.0.0.0 publish it opens the
      # GUI to anyone who can reach the port. Default "token" keeps the lock.
      DSH_WEB_AUTH_MODE: "${DSH_WEB_AUTH_MODE:-token}"

      # Set DSH_TELEMETRY_DISABLED=1 in .env to opt out of harness telemetry.
      DSH_TELEMETRY_DISABLED: "${DSH_TELEMETRY_DISABLED:-}"

    volumes:
      # Your harness data: settings, credentials, chat history, plugins.
      # Defaults to a private volume; point DSH_HOME_DIR at a host folder
      # (e.g. ~/.dsh, to share with a native dsh install) to keep it on disk.
      - ${DSH_HOME_DIR:-dsh-home}:/home/dsh/.dsh
      # The agent's workspace. Defaults to a private volume; point
      # DSH_WORKSPACE_DIR at a host folder (e.g. ./my-project) to let the agent
      # work on real code — it can only ever see what you mount here.
      - ${DSH_WORKSPACE_DIR:-dsh-workspace}:/workspace

    # ── Hardening ───────────────────────────────────────────────────────────
    # Read-only root filesystem: only the two volumes above and /tmp are
    # writable. /tmp must stay exec-capable — the harness extracts and imports
    # bundles from there, and `noexec` breaks first boot.
    read_only: true
    tmpfs:
      - /tmp:rw,exec,nosuid,nodev,size=512m
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 512

volumes:
  dsh-home:
  dsh-workspace:
