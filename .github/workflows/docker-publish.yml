# Build and publish the dsh container image to GHCR.
#
# Publishes ONLY real upstream releases — there is deliberately NO `schedule`
# and no rolling "nightly" build. Every run resolves one or more exact upstream
# versions and pushes, for each:
#   ghcr.io/<owner>/dsh-docker:<version>   (multi-arch, linux/amd64+arm64)
#   ghcr.io/<owner>/dsh-docker:latest      (alias for the NEWEST version built)
#
# This workflow is NOT triggered by git tags (tags are unused in this repo).
# It is triggered by workflow_dispatch from three sources:
#   * main-check — an image-affecting change merged to main, after the hygiene
#     guard passes, dispatches this with `version: all` to re-publish every
#     supported version with the new recipe;
#   * check-upstream-release — the hourly poll dispatches this with all missing
#     supported versions, including older gaps left by failed publishes;
#   * manual dispatch on the Actions tab.
#
# The two automation entry points DISPATCH this via `gh workflow run` rather
# than calling it through the reusable-workflow `uses:` mechanism: referencing
# needs.<job>.outputs/result on a reusable-workflow caller job is silently
# unreliable in GitHub Actions (actions/runner#2495/#3087/#1661;
# shiv-source/thoth#61; see the NOTE in main-check.yml). A dispatched run is a
# normal workflow_dispatch run whose GITHUB_TOKEN carries this workflow's own
# `permissions` block.
#
# Version resolution (see the `resolve` job):
# * `all` -> rebuild EVERY version tag currently published on GHCR that is
#   at/above the supported floor (.supported-version). This is how a
#   container-layer fix (e.g. the bundled proxy) is re-published across all
#   supported releases at once; the NEWEST of them gets the `latest` alias.
# * one or more space-separated versions -> build those exact upstream releases.
# * `missing` -> build every supported upstream release absent from GHCR.
# * empty -> resolve the NEWEST upstream release and build it (so a "rebuild
#   latest" is always a real release, never a default branch).
#
# Native multi-arch (no QEMU) — structure adapted from
# sredevopsorg/multi-arch-docker-github-workflow (MIT, (c) 2025 SREDevOps.org;
# see also the "Attribution" note in CONTRIBUTING): a matrix of builds
# (version × arch; amd64 on ubuntu-latest, arm64 on the ubuntu-24.04-arm hosted
# ARM runner) each push their per-arch image to GHCR **BY DIGEST with no tag**
# (`outputs: type=image,name=…,push-by-digest=true,name-canonical=true`) and
# upload a `<version>__<arch>.digest` file (content = bare sha256) into the
# shared `digests` artifact. A matrix `test` job then runs the FULL repo test
# suite (scripts/*-test.sh) natively against EACH raw per-arch digest — amd64 on
# the x64 runner, arm64 on the hosted ARM runner — BEFORE anything is tagged;
# any single FAIL on either leg aborts the run, so a broken image is never
# tagged or published. Only then does the `merge` job download all digests and,
# per version, create the published multi-arch index from the raw digests (`docker
# buildx imagetools create …  ghcr.io/…@sha256:…`), tag `<version>` (+ `latest`
# for the newest), and VERIFY the result (both platform manifests reachable +
# the amd64 leg runs and reports a version at/above the floor).
#
# Because the per-arch owners are pushed WITHOUT a tag, they stay **untagged**
# versions on GHCR — searchable by digest, never shown among tagged releases —
# so there are no throwaway tags anywhere. They still must NEVER be
# version-deleted: GHCR's version deletion is not reference-aware and removes
# the platform manifest the merged index points at, leaving
# `<version>`/`latest` un-pullable (`manifest not found`, seen on
# 0.1.2-alpha.2 / `:latest`). The untagged owner rows accumulate per release;
# that is the intrinsic price of native multi-arch on GHCR.
name: docker-publish

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Space-separated upstream versions. Empty = newest; all = rebuild published supported versions; missing = all unpublished supported versions."
        required: false
        default: ''

permissions:
  contents: read
  packages: write

concurrency:
  # Serialize GHCR writes across refs; a poll must not cancel a manual rebuild.
  group: docker-publish
  cancel-in-progress: false

jobs:
  # Resolve the exact upstream version(s) to build ONCE (non-matrix) and hand
  # the result to build/test through a fromJSON matrix, and to merge through
  # the versions/latest outputs. This is the single source of truth every other
  # job keys off, and it is where `version: all` fans out into the version set.
  resolve:
    name: resolve version(s)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      build_needed: ${{ steps.version.outputs.build_needed }}
      matrix: ${{ steps.version.outputs.matrix }}
      versions: ${{ steps.version.outputs.versions }}
      latest: ${{ steps.version.outputs.latest }}
      min_supported: ${{ steps.version.outputs.min_supported }}
    steps:
      - name: Checkout this repo (supported-version floor)
        uses: actions/checkout@v5

      - name: Resolve version(s) to build
        id: version
        env:
          VERSION: ${{ inputs.version }}
        run: python3 scripts/release-versions.py --version "$VERSION"

  build:
    name: build (${{ matrix.version }} / ${{ matrix.arch }})
    needs: resolve
    if: needs.resolve.outputs.build_needed == 'true'
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - name: Checkout this repo (recipe + build scripts)
        uses: actions/checkout@v5

      - name: Resolve upstream ref (${{ matrix.version }})
        id: upstream
        env:
          VERSION: ${{ matrix.version }}
        run: |
          # Upstream tags releases as dsh-v<version> (e.g. dsh-v0.1.2-alpha.3).
          # Try the plain and prefixed forms so any resolved version maps to the
          # REAL release snapshot instead of silently falling back to master
          # (which used to mislabel the published images).
          REF=""
          for candidate in "refs/tags/$VERSION" "refs/tags/dsh-v$VERSION"; do
            if git ls-remote --exit-code --refs \
                 https://github.com/deepseek-ai/deepseek-harness.git \
                 "$candidate" >/dev/null 2>&1; then
              REF="${candidate#refs/tags/}"
              break
            fi
          done
          [ -n "$REF" ] || REF="master"
          echo "ref=$REF" | tee -a "$GITHUB_OUTPUT"

      - name: Checkout harness source
        uses: actions/checkout@v5
        with:
          repository: deepseek-ai/deepseek-harness
          ref: ${{ steps.upstream.outputs.ref }}
          path: upstream

      - name: Capture source commit
        id: commit
        run: echo "commit=$(git -C upstream rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Stage the build context
        run: DSH_SRC="$(pwd)/upstream" ./scripts/build-context.sh

      - name: Prepare platform pair name (for artifact naming)
        run: echo "PLATFORM_PAIR=linux-${{ matrix.arch }}" >> "$GITHUB_ENV"

      # Native per-arch builds — no QEMU setup needed on either runner.
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image name
        id: image
        run: |
          # GHCR refs must be all-lowercase; github.repository keeps the owner's
          # case (e.g. AndreasSeidl/dsh-docker -> andreasseidl/dsh-docker), so
          # derive it via bash's @L lowercase expansion.
          echo "image=ghcr.io/${GITHUB_REPOSITORY@L}" | tee -a "$GITHUB_OUTPUT"

      - name: Build and push by digest (linux/${{ matrix.arch }})
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .docker-context
          platforms: linux/${{ matrix.arch }}
          # push by DIGEST with NO tag: the per-arch image lands on GHCR as an
          # untagged, content-addressed version (searchable by digest, never
          # shown among tagged releases). The merge job joins the raw digests.
          outputs: type=image,name=${{ steps.image.outputs.image }},push-by-digest=true,name-canonical=true,push=true,oci-mediatypes=true
          # Read existing registry caches, but stage writes locally. Cache tags
          # are published only after the full test matrix passes (publish-cache).
          # Registry-only: the gha backend is neither written (its export hangs
          # on this repo's layer sizes) nor read (an unwritten scope can only
          # ever serve entries staler than the registry buildcache below).
          cache-from: |
            type=registry,ref=${{ steps.image.outputs.image }}:buildcache-${{ matrix.version }}-${{ matrix.arch }}
            type=registry,ref=${{ steps.image.outputs.image }}:buildcache-${{ needs.resolve.outputs.latest }}-${{ matrix.arch }}
          cache-to: type=local,mode=max,dest=${{ runner.temp }}/buildcache
          # Disable BuildKit's default SLSA provenance/SBOM attestations: they
          # are pushed as extra index entries with no os/arch and show up as
          # "unknown/unknown" platforms in UIs and `manifest inspect` (and
          # pinning by their digest yields a non-runnable stub). We don't need
          # the attestation metadata here, so keep the published index clean:
          # only the two real platform images.
          provenance: false
          sbom: false
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ matrix.version }}
            org.opencontainers.image.description=DeepSeek Harness (dsh web) container
          build-args: |
            DSH_CLIENT_COMMIT_HASH=${{ steps.commit.outputs.commit }}

      - name: Export digest
        run: |
          # One file per built image, named <version>__<arch>.digest with the
          # bare sha256 as content — kept unambiguous across multiple versions
          # in a single `all` run, uploaded into one shared artifact.
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          printf '%s' "${digest#sha256:}" > "/tmp/digests/${{ matrix.version }}__${{ matrix.arch }}.digest"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          # Unique name per leg (version × arch) so concurrent uploads never
          # contend on the same artifact; the file name carries the same info.
          name: digests-${{ matrix.version }}-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

      - name: Archive the staged build cache
        run: tar -C "${{ runner.temp }}/buildcache" -cf "${{ runner.temp }}/buildcache.tar" .

      - name: Upload staged build cache
        uses: actions/upload-artifact@v7
        with:
          name: buildcache-${{ matrix.version }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/buildcache.tar
          compression-level: 0
          if-no-files-found: error
          retention-days: 1

  # Gate between build and publish: run the repo's full test suite natively on
  # EACH arch's build output (the untagged owner digest) BEFORE `merge` tags
  # anything — amd64 on the x64 runner, arm64 on the hosted ARM runner (arm64
  # cannot execute on an amd64 runner). A breaking change upstream that fails
  # even one check on either leg therefore aborts here and nothing reaches ghcr
  # as a user-facing tag.
  test:
    name: test (${{ matrix.version }} / ${{ matrix.arch }})
    needs: [resolve, build]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    steps:
      - name: Checkout this repo (tests + compose files + floor)
        uses: actions/checkout@v5

      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image and digest ref (${{ matrix.version }} / ${{ matrix.arch }})
        id: meta
        run: |
          # This leg's digest is in a file named <version>__<arch>.digest.
          IMG="ghcr.io/${GITHUB_REPOSITORY@L}"
          F="/tmp/digests/${{ matrix.version }}__${{ matrix.arch }}.digest"
          D="$(cat "$F" 2>/dev/null || true)"
          [ -n "$D" ] || { echo "error: no ${{ matrix.version }}/${{ matrix.arch }} digest ($F)" >&2; exit 1; }
          echo "image=$IMG" >> "$GITHUB_OUTPUT"
          echo "digest=sha256:$D" >> "$GITHUB_OUTPUT"
          echo "  testing $IMG@sha256:$D (linux/${{ matrix.arch }}, ${{ matrix.version }})"

      # The suites branch on `docker inspect "$DSH_IMAGE"` and `docker exec`, so
      # the digest must be present locally before the first check.
      - name: Pull the build output (${{ matrix.arch }})
        run: docker pull "${{ steps.meta.outputs.image }}@${{ steps.meta.outputs.digest }}"

      # The whole point of this job: the image about to be tagged must first
      # pass the same suites we run locally. Each exits nonzero on any FAIL;
      # with `set -e` the step (and therefore the run) aborts. The suites exit 0
      # "skipping" only for images below the supported floor, which the resolve
      # job already refuses to build — so a consequential skip is impossible
      # and a skip is never treated as a pass anyway.
      - name: Run the full test suite against the build output
        env:
          DSH_IMAGE: ${{ steps.meta.outputs.image }}@${{ steps.meta.outputs.digest }}
        run: |
          set -euo pipefail
          echo "== smoke =="
          ./scripts/smoke-test.sh
          echo "== server-mode =="
          ./scripts/server-mode-test.sh
          echo "== compose =="
          ./scripts/compose-test.sh
          echo "== trust-proxy =="
          ./scripts/trust-proxy-test.sh
          echo "=== ALL FOUR SUITES PASSED on linux/${{ matrix.arch }} ($DSH_IMAGE) — safe to mark for publish ==="

  # A failed test on EITHER architecture leaves all GHCR buildcache tags alone.
  # Artifacts expire automatically; no registry deletion or extra token scope.
  publish-cache:
    name: publish cache (${{ matrix.version }} / ${{ matrix.arch }})
    needs: [resolve, test]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.resolve.outputs.matrix) }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v8
        with:
          name: buildcache-${{ matrix.version }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/staged-cache
      - uses: regclient/actions/regctl-installer@bb562fac724b7b37c17f19671df07fe34fabc376
        with:
          release: v0.11.6
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the tested build cache
        env:
          VERSION: ${{ matrix.version }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          CACHE="${{ runner.temp }}/buildcache"
          mkdir -p "$CACHE"
          tar -C "$CACHE" -xf "${{ runner.temp }}/staged-cache/buildcache.tar"
          ./scripts/publish-buildcache.sh "$CACHE" "ghcr.io/${GITHUB_REPOSITORY@L}:buildcache-$VERSION-$ARCH"

  merge:
    name: merge multi-arch manifests (verify)
    needs:
      - resolve
      - build
      - test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout this repo (supported-version floor)
        uses: actions/checkout@v5

      - name: Download digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - name: Compute image
        id: meta
        run: |
          IMG="ghcr.io/${GITHUB_REPOSITORY@L}"
          echo "image=$IMG" >> "$GITHUB_OUTPUT"

      - name: Create multi-arch manifests and verify
        env:
          IMG: ${{ steps.meta.outputs.image }}
          VERSIONS: ${{ needs.resolve.outputs.versions }}
          LATEST: ${{ needs.resolve.outputs.latest }}
        run: |
          set -euo pipefail
          [ -n "$VERSIONS" ] || { echo "error: no versions to merge" >&2; exit 1; }
          MIN_SUPPORTED="$(grep -m1 -E '^[0-9]' .supported-version 2>/dev/null | tr -d '[:space:]' || true)"
          version_ge() { [ "$(printf '%s\n%s\n' "$1" "$2" | sort -V | tail -n1)" = "$1" ]; }

          cd /tmp/digests
          printf '  digest file: %s\n' *.digest

          ANNOTATIONS=(
            --annotation 'index:org.opencontainers.image.description=DeepSeek Harness (dsh web) container'
            --annotation "index:org.opencontainers.image.created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')"
            --annotation "index:org.opencontainers.image.url=${{ github.server_url }}/${{ github.repository }}"
            --annotation "index:org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}"
          )

          for v in $VERSIONS; do
            # --- 1) merge ---
            # NB: `${v}` braces are required — `$v__amd64` would name a single
            # variable called v__amd64 (bash: `_` is a valid name char).
            DAMD="$(cat "${v}__amd64.digest" 2>/dev/null || true)"
            DARM="$(cat "${v}__arm64.digest" 2>/dev/null || true)"
            [ -n "$DAMD" ] && [ -n "$DARM" ] \
              || { echo "error: missing amd64/arm64 digests for $v" >&2; exit 1; }
            REFS=("$IMG@sha256:$DAMD" "$IMG@sha256:$DARM")
            echo "merging $v: ${REFS[*]}"
            # Every publish is a real (versioned) release; `latest` aliases the
            # newest selected/published version. Backfills never demote latest.
            TAGS=(-t "$IMG:$v")
            [ "$v" = "$LATEST" ] && TAGS+=(-t "$IMG:latest")
            docker buildx imagetools create \
              "${TAGS[@]}" "${ANNOTATIONS[@]}" "${REFS[@]}" \
              || { echo "merge failed for $v" >&2; exit 1; }
            echo "  published $IMG:$v$([ "$v" = "$LATEST" ] && echo ' + latest')"

            # --- 2) verify the published tags resolve to real content ---
            # Resolve every platform manifest the fresh index references. This is
            # exactly the check that would have caught the 0.1.2-alpha.2 failure
            # (index present, platform content gone). `--verbose` forces docker
            # to fetch each child manifest, not just the index.
            echo "== verifying $IMG:$v =="
            docker manifest inspect --verbose "$IMG:$v" >/dev/null \
              || { echo "FATAL: $IMG:$v references unreachable platform content" >&2; exit 1; }
            for d in "$DAMD" "$DARM"; do
              docker manifest inspect --verbose "$IMG@sha256:$d" >/dev/null 2>&1 \
                || { echo "FATAL: owner digest sha256:$d unreachable" >&2; exit 1; }
              echo "  sha256:$d reachable"
            done
            # Full smoke on the host architecture — the same path `docker compose
            # up` takes. (arm64 can't *execute* on an amd64 runner, but its
            # manifest was just verified reachable above.) Also assert the image
            # reports a harness version at or above the supported floor.
            BOT="$(docker run --rm --platform linux/amd64 "$IMG:$v" --version 2>/dev/null | head -n1 | tr -d '[:space:]' || true)"
            [ -n "$BOT" ] || { echo "FATAL: published image does not run / report a version" >&2; exit 1; }
            if version_ge "$BOT" "$MIN_SUPPORTED"; then
              echo "  verified: pulls/runs (amd64), reports $BOT >= floor ${MIN_SUPPORTED:-<missing>}"
            else
              echo "FATAL: $IMG:$v reports $BOT, below the supported floor $MIN_SUPPORTED" >&2
              exit 1
            fi
          done

          # `latest` also resolves when this batch only backfills older gaps.
          docker manifest inspect --verbose "$IMG:latest" >/dev/null \
            || { echo "FATAL: $IMG:latest unreachable" >&2; exit 1; }

          # The untagged per-arch owners backing these tags are left in place
          # forever: GHCR has no tag-removal API, and version-deleting an owner
          # breaks the freshly published tag (see the file header).
          echo "published: $VERSIONS"
          echo "  $IMG:latest remains the newest release ($LATEST)"
          echo "  (owners kept as untagged digests)"

  # Keep the registry buildcache bounded. Unlike the gha cache, GHCR buildcache
  # storage has NO automatic eviction — each build pushes ~2-3 GB of builder
  # layers per (version × arch) and it only ever grows. This job deletes every
  # buildcache GHCR "version" whose tags are exclusively `buildcache-*` for a
  # version BELOW the supported floor: once a version drops off the floor it can
  # never be built again, so its builder cache is pure dead weight.
  # It deliberately never touches the published <version>/latest tags and never
  # touches UNTAGGED versions — the per-arch owner digests are untagged and
  # deleting one would break a published tag (see the file header). Consequence:
  # a superseded buildcache digest whose tag moved is left as an untagged
  # remnant; that only happens on a republish of the same (version × arch)
  # (rare), so it stays bounded in practice.
  # Runs only after successful tests; failed tests never mutate cache tags.
  # It only operates below the
  # floor, which the current run never rebuilds. continue-on-error keeps it
  # non-fatal — if the token lacks delete:packages the publish is never blocked;
  # the fix is a PAT with delete:packages in a DSH_PAT secret.
  prune-buildcache:
    needs: [test]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    steps:
      - uses: actions/checkout@v5

      - name: Delete buildcache versions below the supported floor
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          OWNER="${GITHUB_REPOSITORY%/*}"
          PKG="${GITHUB_REPOSITORY#*/}"
          MIN_SUPPORTED="$(grep -m1 -E '^[0-9]' .supported-version 2>/dev/null | tr -d '[:space:]' || true)"
          [ -n "$MIN_SUPPORTED" ] || { echo "skip: no .supported-version floor"; exit 0; }
          version_ge() { [ "$(printf '%s\n%s\n' "$1" "$2" | sort -V | tail -n1)" = "$1" ]; }

          # GHCR container packages are owner-scoped: under the org when the
          # repo is org-owned, under the authenticated user otherwise.
          if curl -fsS -H "Authorization: Bearer $GH_TOKEN" \
                 "https://api.github.com/orgs/$OWNER" >/dev/null 2>&1; then
            SCOPE="/orgs/$OWNER"
          else
            SCOPE="/user"
          fi
          BASE="https://api.github.com${SCOPE}/packages/container/$PKG"

          DELETED=0
          PAGE=1
          while :; do
            DATA="$(curl -fsS -H "Authorization: Bearer $GH_TOKEN" \
                       "$BASE/versions?per_page=100&page=$PAGE" || true)"
            [ -n "$DATA" ] || { echo "note: package $PKG not listable (skip prune)"; break; }
            [ "$(printf '%s' "$DATA" | jq 'length')" != "0" ] || break
            for id in $(printf '%s' "$DATA" | jq -r '.[].id'); do
              TAGS="$(printf '%s' "$DATA" | jq -r --argjson id "$id" \
                '.[] | select(.id==$id) | ((.metadata.container.tags // []) | join(" "))')"
              # Only versions whose tags are ALL buildcache-*: never published
              # <version>/latest tags, never untagged (owner) digests.
              ALL_BUILDCACHE=1
              for t in $TAGS; do
                case "$t" in buildcache-*) ;; *) ALL_BUILDCACHE=0 ;; esac
              done
              [ "$ALL_BUILDCACHE" = "1" ] || continue
              [ -n "$TAGS" ] || continue
              # Every tag here is buildcache-<version>-<arch>; parse a version
              # out of the first one.
              V=""
              for t in $TAGS; do
                t="${t#buildcache-}"
                t="${t%-amd64}"
                t="${t%-arm64}"
                V="$t"
                [ -n "$V" ] && break
              done
              if [ -z "$V" ]; then
                echo "keep unparseable buildcache tag '$TAGS' (version $id)"
              elif version_ge "$V" "$MIN_SUPPORTED"; then
                echo "keep buildcache-$V (version $id)"
              else
                echo "delete buildcache-$V (version $id)"
                curl -fsS -X DELETE -H "Authorization: Bearer $GH_TOKEN" \
                     "$BASE/versions/$id" \
                  && DELETED=$((DELETED+1)) \
                  || echo "  WARNING: cannot delete version $id (token lacks delete:packages?)"
              fi
            done
            PAGE=$((PAGE+1))
          done
          echo "done: deleted $DELETED buildcache version(s) below floor $MIN_SUPPORTED"
