# Build and publish the dsh container image to GHCR.
#
# Publishes ONLY real upstream releases — there is deliberately NO `schedule`
# and no rolling "nightly" build. Every run resolves an exact upstream version
# and pushes
#   ghcr.io/<owner>/dsh-docker:<version>   (multi-arch, linux/amd64+arm64)
#   ghcr.io/<owner>/dsh-docker:latest      (alias for the newest release)
#
# * On a git TAG (e.g. `v0.1.1-rc.2` or `0.1.1-rc.2`) -> build the harness at
#   that upstream version. Upstream tags releases as `dsh-v<version>`; the
#   resolver accepts both the plain and prefixed forms so the tagged snapshot
#   is built, never master.
# * Manually (workflow_dispatch): with a `version` input, build that upstream
#   tag/commit; without one, resolve the NEWEST upstream release and build it
#   (so a "rebuild latest" is always a real release, never a default branch).
# * Reusable (workflow_call, `version` input) -> called by the hourly
#   check-upstream-release workflow when a newer upstream release appears.
#
# NATIVE multi-arch: two matrix jobs build linux/amd64 (ubuntu-latest) and
# linux/arm64 (ubuntu-24.04-arm hosted ARM runner) natively — no QEMU, so the
# arm64 leg is as fast as amd64. Each platform is pushed under a throwaway
# hash-like tag `sha256-<md5(run-id-arch)[0:12]>` (an obvious build artifact,
# NOT a release), which the `merge` job recomputes deterministically — no
# matrix output plumbing. The merge job then:
#   1. joins them with `docker buildx imagetools create` into the multi-arch
#      index published as `<version>` + `latest`;
#   2. VERIFIES the published tags actually resolve (both platform manifests
#      reachable) and that the image runs (`docker run` the amd64 leg);
#   3. UNTAGS the per-arch owner tags with `regctl tag rm` — the owner
#      versions (and all their content) are KEPT, only the readable `sha256-*`
#      tags go, so the tag overview shows just `<version>` + `latest` and the
#      published tag can never break. After untagging it re-verifies the tag
#      once more.
#
# Why the owners are untagged and NEVER version-deleted: GHCR's version
# deletion is not reference-aware — deleting a per-arch "owner" version removes
# the platform manifest the merged index points at, leaving the published tag
# un-pullable (`manifest not found`, seen on 0.1.2-alpha.2 / `:latest`). The
# owners of 0.1.2-alpha.1 / 0.1.1-rc.2 survive precisely because they were
# untagged — not deleted. Untagging lands in exactly that safe state. (The
# verify-prune-safety.yml workflow is a reproducible experiment for these
# claims; the owners show as "Untagged" rows in the GHCR Versions view.)
name: docker-publish

on:
  push:
    tags: ['v*', '[0-9]*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Upstream dsh version/tag to build (empty = newest upstream release; never nightly)'
        required: false
        default: ''
  # Reusable entry point: check-upstream-release.yml calls this with an explicit
  # upstream version whenever an hourly poll finds a newer release. `version` is
  # mirrored from workflow_dispatch, so the resolution steps below work for
  # both entry points unchanged.
  workflow_call:
    inputs:
      version:
        description: 'Upstream dsh version/tag to build'
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout this repo (recipe + build scripts)
        uses: actions/checkout@v4

      - name: Resolve release version
        id: version
        run: |
          VERSION=""
          if [ "${{ github.event_name }}" = "push" ] && [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
            VERSION="${VERSION#v}"                 # accept both v0.1.1-rc.2 and 0.1.1-rc.2
          elif [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Manual dispatch with no version: build the newest upstream
            # release (what the poller would have picked), so there is never a
            # "nightly" (rolling default-branch) publish.
            VERSION="$(git ls-remote --refs --tags \
                         https://github.com/deepseek-ai/deepseek-harness.git \
                         'refs/tags/dsh-v*' \
                         | sed 's#.*refs/tags/dsh-v##; s/\^{}//' | sort -V | tail -1)"
            echo "note: no version given - resolved newest upstream release: ${VERSION:-<none>}"
          fi
          [ -n "$VERSION" ] || { echo "error: could not resolve an upstream version to build" >&2; exit 1; }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Resolve upstream ref
        id: upstream
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Upstream tags releases as dsh-v<version> (e.g. dsh-v0.1.2-alpha.2).
          # Try the plain and prefixed forms so a container tag (v0.1.2-alpha.2
          # or 0.1.2-alpha.2) resolves to the REAL release snapshot instead of
          # silently falling back to master (which used to mislabel the
          # published images).
          REF=""
          for candidate in "refs/tags/$VERSION" "refs/tags/dsh-v$VERSION"; do
            if git ls-remote --exit-code --refs \
                 https://github.com/deepseek-ai/deepseek-harness.git \
                 "$candidate" >/dev/null 2>&1; then
              REF="${candidate#refs/tags/}"
              break
            fi
          done
          [ -n "$REF" ] || REF="master"
          echo "ref=$REF" | tee -a "$GITHUB_OUTPUT"

      - name: Checkout harness source
        uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: ${{ steps.upstream.outputs.ref }}
          path: upstream

      - name: Capture source commit
        id: commit
        run: echo "commit=$(git -C upstream rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Stage the build context
        run: DSH_SRC="$(pwd)/upstream" ./scripts/build-context.sh

      # Native per-arch builds — no QEMU setup needed on either runner.
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image and tags
        id: tags
        run: |
          # GHCR refs must be all-lowercase; github.repository keeps the owner's
          # case (e.g. AndreasSeidl/dsh-docker -> andreasseidl/dsh-docker), so
          # derive it via bash's @L lowercase expansion.
          IMG="ghcr.io/${GITHUB_REPOSITORY@L}"
          echo "image=$IMG" | tee -a "$GITHUB_OUTPUT"
          # Throwaway per-arch tag. Its hash-like name (md5 of run-id + arch,
          # first 12 hex chars) makes it read as a build artifact, never a
          # release — so nobody mistakes `sha256-*` rows for published versions.
          # The merge job recomputes the exact same names, so it needs no
          # matrix-output plumbing. These versions are the "owners" of the
          # platform content the merged multi-arch index references: they must
          # outlive the merge (they are pruned only much later, see the header).
          H="$(printf '%s-%s' "${{ github.run_id }}" "${{ matrix.arch }}" | md5sum | cut -c1-12)"
          echo "throwaway=$IMG:sha256-$H" | tee -a "$GITHUB_OUTPUT"

      - name: Build and push (linux/${{ matrix.arch }})
        uses: docker/build-push-action@v6
        with:
          context: .docker-context
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ steps.tags.outputs.throwaway }}
          # Warm-cache plumbing. type=gha is SELF-MANAGING: GitHub caps it per
          # repo (~10 GB for public repos) and evicts LRU / 7-day-stale entries,
          # so it cannot grow without bound. Per-arch scope keeps amd64/arm64
          # caches independent. mode=max stores intermediate layers so the
          # builder stages (~90% of the compile cost) are reused. No registry
          # buildcache: it is additive with no size eviction (the unbounded
          # analogue of a 100 GB local build cache) — see README "Cache hygiene".
          cache-from: type=gha,scope=dsh-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=dsh-${{ matrix.arch }}
          # Disable BuildKit's default SLSA provenance/SBOM attestations: they
          # are pushed as extra index entries with no os/arch and show up as
          # "unknown/unknown" platforms in UIs and `manifest inspect` (and
          # pinning by their digest yields a non-runnable stub). We don't need
          # the attestation metadata here, so keep the published index clean:
          # only the two real platform images.
          provenance: false
          sbom: false
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.description=DeepSeek Harness (dsh web) container
          build-args: |
            DSH_CLIENT_COMMIT_HASH=${{ steps.commit.outputs.commit }}

  merge:
    name: merge multi-arch manifest (verify + delayed prune)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Install regctl (tag-delete tool)
        run: |
          curl -fsSL -m 60 -o /usr/local/bin/regctl \
            "https://github.com/regclient/regclient/releases/latest/download/regctl-linux-amd64"
          chmod +x /usr/local/bin/regctl
          regctl version

      - name: Compute image and target
        id: meta
        run: |
          IMG="ghcr.io/${GITHUB_REPOSITORY@L}"
          echo "image=$IMG" >> "$GITHUB_OUTPUT"
          # Always the build job's resolved version (it applies the newest-
          # upstream fallback for an empty manual dispatch), never "nightly".
          echo "target=${{ needs.build.outputs.version }}" >> "$GITHUB_OUTPUT"

      - name: Create multi-arch manifest, verify and untag owners
        env:
          IMG: ${{ steps.meta.outputs.image }}
          TARGET: ${{ steps.meta.outputs.target }}
        run: |
          set -u

          # --- 1) merge ---
          # Re-discover the two throwaway per-arch images by recomputing the
          # deterministic names the build matrix used (md5 of run-id + arch).
          RID="${{ github.run_id }}"
          ARCH_TAGS=""
          for a in amd64 arm64; do
            H="$(printf '%s-%s' "$RID" "$a" | md5sum | cut -c1-12)"
            REF="$IMG:sha256-$H"
            if docker buildx imagetools inspect "$REF" >/dev/null 2>&1; then
              ARCH_TAGS="$ARCH_TAGS $REF"
              echo "found $REF"
            else
              echo "warning: missing $REF — skipping"
            fi
          done
          [ -n "$ARCH_TAGS" ] || { echo "no per-arch images to merge" >&2; exit 1; }
          # Every publish is a real (versioned) release; `latest` aliases the
          # newest one. Neither is ever "nightly".
          FINAL_TAGS="-t $IMG:$TARGET -t $IMG:latest"
          docker buildx imagetools create $FINAL_TAGS $ARCH_TAGS \
            || { echo "merge failed" >&2; exit 1; }
          echo "published $IMG:$TARGET + $IMG:latest"

          # --- 2) verify BEFORE touching the owner rows ---
          # Resolve every platform manifest the fresh index references. This is
          # exactly the check that would have caught the 0.1.2-alpha.2 failure
          # (index present, platform content gone). `--verbose` forces docker
          # to fetch each child manifest, not just the index.
          echo "== verifying published tags resolve to real content =="
          for REF in "$IMG:$TARGET" "$IMG:latest"; do
            docker manifest inspect --verbose "$REF" >/dev/null \
              || { echo "FATAL: $REF references unreachable platform content" >&2; exit 1; }
            echo "  $REF: both platform manifests reachable"
          done
          # Full smoke on the host architecture — the same path `docker compose
          # up` takes. (arm64 can't *execute* on an amd64 runner, but its
          # manifest was just verified reachable above.)
          docker run --rm --platform linux/amd64 "$IMG:$TARGET" --version >/dev/null \
            || { echo "FATAL: published image does not run" >&2; exit 1; }
          echo "  verified: $IMG:$TARGET pulls and runs (amd64)"

          # --- 3) tag-delete the per-arch owner tags (KEEP the versions/content) ---
          # The per-arch versions are the long-term "owners" of the platform
          # content the merged index references. They must NEVER be
          # version-deleted: GHCR's version deletion is not reference-aware and
          # removes the platform manifests the index points at, breaking the
          # published tag — that is exactly the 0.1.2-alpha.2 incident (see
          # verify-prune-safety.yml / CONTRIBUTING). `regctl tag rm` removes
          # only the readable `sha256-*` tag (on registries without the OCI
          # tag-delete API regctl pushes a throwaway dummy manifest and deletes
          # that by digest instead, never the real image): the version row and
          # ALL its content remain (digest-searchable), the tag overview stays
          # clean (only `<version>` and `latest` are tagged), and the published
          # tag can never break. Best-effort: a failed tag-delete just leaves a
          # sha256-* tag behind (harmless — it reads as a build artifact, never
          # a release).
          echo "== tag-deleting owner tags (keep versions) =="
          for a in amd64 arm64; do
            H="$(printf '%s-%s' "$RID" "$a" | md5sum | cut -c1-12)"
            REF="$IMG:sha256-$H"
            echo "  regctl tag rm $REF"
            regctl tag rm "$REF" || echo "  warning: could not tag-rm $REF (leaving the tag)"
          done

          # Final safety net: the merged tag must STILL resolve after untagging.
          if ! docker manifest inspect --verbose "$IMG:$TARGET" >/dev/null; then
            echo "FATAL: published tag broke after untagging owners" >&2; exit 1
          fi
          echo "verified after untag: $IMG:$TARGET + $IMG:latest resolve cleanly"
