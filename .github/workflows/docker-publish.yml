# Build and publish the dsh container image to GHCR.
#
#   * On a git TAG (e.g. `v0.1.1-rc.2` or `0.1.1-rc.2`) → build the harness at
#     that upstream version and push
#       ghcr.io/<owner>/dsh-docker:<version>   (multi-arch, linux/amd64+arm64)
#       ghcr.io/<owner>/dsh-docker:latest
#     Upstream tags releases as `dsh-v<version>`; the resolver accepts both the
#     plain and prefixed forms so the tagged snapshot is built, never master.
#   * Every Monday 03:30 UTC → build the upstream default branch and push
#       ghcr.io/<owner>/dsh-docker:nightly   (keeps "latest source" rolling)
#   * Manually (workflow_dispatch, `version` input) → build any upstream
#     tag/commit and push <version>.
#   * Reusable (workflow_call, `version` input) → called by the hourly
#     check-upstream-release workflow when a newer upstream release appears.
#
# NATIVE multi-arch: two matrix jobs build linux/amd64 (ubuntu-latest) and
# linux/arm64 (ubuntu-24.04-arm hosted ARM runner) natively — no QEMU, so the
# arm64 leg is as fast as amd64 (QEMU cross-building once cost ~1 h of emulated
# pnpm/tsc on a cold run). Each platform pushes a throwaway per-arch tag
# (dsh-int-<arch>-<run-id>); the `merge` job joins them into the final multi-arch
# manifest with `docker buildx imagetools create`, then deletes the throwaway
# versions via the GitHub REST API so GHCR keeps only the versioned multi-arch
# rows (no `<version>-amd64`/`<version>-arm64` rows).
name: docker-publish

on:
  push:
    tags: ['v*', '[0-9]*']
  schedule:
    - cron: '30 3 * * 1'
  workflow_dispatch:
    inputs:
      version:
        description: 'Upstream dsh version/tag to build (default: upstream default branch)'
        required: false
        default: ''
  # Reusable entry point: check-upstream-release.yml calls this with an explicit
  # upstream version whenever an hourly poll finds a newer release. `version` is
  # mirrored from workflow_dispatch, so the resolution steps below work for
  # both entry points unchanged.
  workflow_call:
    inputs:
      version:
        description: 'Upstream dsh version/tag to build (default: upstream default branch)'
        required: false
        type: string

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - name: Checkout this repo (recipe + build scripts)
        uses: actions/checkout@v4

      - name: Resolve release version
        id: version
        run: |
          VERSION=""
          if [ "${{ github.event_name }}" = "push" ] && [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
            VERSION="${VERSION#v}"                 # accept both v0.1.1-rc.2 and 0.1.1-rc.2
          elif [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Resolve upstream ref
        id: upstream
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Upstream tags releases as dsh-v<version> (e.g. dsh-v0.1.2-alpha.1).
          # Try the plain and prefixed forms so a container tag (v0.1.2-alpha.1
          # or 0.1.2-alpha.1) resolves to the REAL release snapshot instead of
          # silently falling back to master (which used to mislabel the
          # published images).
          REF=""
          for candidate in "refs/tags/$VERSION" "refs/tags/dsh-v$VERSION"; do
            if git ls-remote --exit-code --refs \
                 https://github.com/deepseek-ai/deepseek-harness.git \
                 "$candidate" >/dev/null 2>&1; then
              REF="${candidate#refs/tags/}"
              break
            fi
          done
          [ -n "$REF" ] || REF="master"
          echo "ref=$REF" | tee -a "$GITHUB_OUTPUT"

      - name: Checkout harness source
        uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: ${{ steps.upstream.outputs.ref }}
          path: upstream

      - name: Capture source commit
        id: commit
        run: echo "commit=$(git -C upstream rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Stage the build context
        run: DSH_SRC="$(pwd)/upstream" ./scripts/build-context.sh

      # Native per-arch builds — no QEMU setup needed on either runner.
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image and tags
        id: tags
        run: |
          # GHCR refs must be all-lowercase; github.repository keeps the owner's
          # case (e.g. AndreasSeidl/dsh-docker -> andreasseidl/dsh-docker), so
          # derive it via bash's @L lowercase expansion.
          IMG="ghcr.io/${GITHUB_REPOSITORY@L}"
          echo "image=$IMG" | tee -a "$GITHUB_OUTPUT"
          VERSION="${{ steps.version.outputs.version }}"
          TARGET="$VERSION"
          [ -n "$TARGET" ] || TARGET="nightly"
          echo "target=$TARGET" | tee -a "$GITHUB_OUTPUT"
          # Throwaway per-arch tag: the merge job joins these into the final
          # multi-arch manifest and then deletes them, so GHCR keeps only the
          # versioned multi-arch rows. They are NOT part of the multi-arch
          # index (the index references the platform images directly), so they
          # are safe to remove. github.run_id keeps them unique per run; bare
          # refs would push to docker.io/library, so always fully qualified.
          echo "perarch_tags=$IMG:dsh-int-${{ matrix.arch }}-${{ github.run_id }}" | tee -a "$GITHUB_OUTPUT"

      - name: Build and push (linux/${{ matrix.arch }})
        uses: docker/build-push-action@v6
        with:
          context: .docker-context
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ steps.tags.outputs.perarch_tags }}
          # Warm-cache plumbing. type=gha is SELF-MANAGING: GitHub caps it per
          # repo (~10 GB for public repos) and evicts LRU / 7-day-stale entries,
          # so it cannot grow without bound. Per-arch scope keeps amd64/arm64
          # caches independent. mode=max stores intermediate layers so the
          # builder stages (~90% of the compile cost) are reused. No registry
          # buildcache: it is additive with no size eviction (the unbounded
          # analogue of a 100 GB local build cache) — see README "Cache hygiene".
          cache-from: type=gha,scope=dsh-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=dsh-${{ matrix.arch }}
          # Disable BuildKit's default SLSA provenance/SBOM attestations: they
          # are pushed as extra index entries with no os/arch and show up as
          # "unknown/unknown" platforms in UIs and `manifest inspect` (and
          # pinning by their digest yields a non-runnable stub). We don't need
          # the attestation metadata here, so keep the published index clean:
          # only the two real platform images.
          provenance: false
          sbom: false
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.description=DeepSeek Harness (dsh web) container
          build-args: |
            DSH_CLIENT_COMMIT_HASH=${{ steps.commit.outputs.commit }}

  merge:
    name: merge multi-arch manifest
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image and target
        id: meta
        run: |
          IMG="ghcr.io/${GITHUB_REPOSITORY@L}"
          VERSION=""
          if [ "${{ github.event_name }}" = "push" ] && [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
            VERSION="${VERSION#v}"
          elif [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          fi
          TARGET="$VERSION"
          [ -n "$TARGET" ] || TARGET="nightly"
          echo "image=$IMG" >> "$GITHUB_OUTPUT"
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"

      - name: Create combined multi-arch manifest
        env:
          IMG: ${{ steps.meta.outputs.image }}
          TARGET: ${{ steps.meta.outputs.target }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Merge the two throwaway per-arch tags into one multi-arch index
          # (`:version` + `:latest`, or `:nightly`), then delete the throwaway
          # `dsh-int-<arch>-<run>` versions via the GitHub REST API so the
          # package keeps only the versioned multi-arch rows. The multi-arch
          # index references the platform IMAGES directly — not these
          # single-platform index versions — so removing them never breaks the
          # published tag.
          set -u
          ARCH_TAGS=""
          for a in amd64 arm64; do
            INT="$IMG:dsh-int-$a-${{ github.run_id }}"
            if docker buildx imagetools inspect "$INT" >/dev/null 2>&1; then
              ARCH_TAGS="$ARCH_TAGS $INT"
            else
              echo "warning: missing $INT — skipping"
            fi
          done
          [ -n "$ARCH_TAGS" ] || { echo "no per-arch images to merge" >&2; exit 1; }
          FINAL_TAGS="-t $IMG:$TARGET"
          [ "$TARGET" = "nightly" ] || FINAL_TAGS="$FINAL_TAGS -t $IMG:latest"
          docker buildx imagetools create $FINAL_TAGS $ARCH_TAGS \
            || { echo "merge failed" >&2; exit 1; }
          echo "published $IMG:$TARGET (${TARGET} tag set)"

          echo
          echo "== cleanup: deleting throwaway dsh-int-* per-arch versions =="
          # GHCR has no registry-level DELETE (`405 UNSUPPORTED`), so use the
          # GitHub REST API with the run's GITHUB_TOKEN. Best-effort: a cleanup
          # failure must not fail the publish (the merged multi-arch tag already
          # exists), it just leaves a dsh-int-* row to delete manually.
          if [ -n "${TOKEN:-}" ]; then
            for a in amd64 arm64; do
              INT="$IMG:dsh-int-$a-${{ github.run_id }}"
              VID="$(curl -s -H 'Authorization: Bearer '"$TOKEN" \
                       "https://api.github.com/user/packages/container/${GITHUB_REPOSITORY#*/}/versions?per_page=200" \
                     | python3 - "$INT" <<'PYEOF'
          import json, sys
          tag = sys.argv[1]
          try:
              vs = json.load(sys.stdin)
          except Exception:
              vs = []
          for v in vs:
              if tag in (v.get("metadata", {}).get("container", {}).get("tags") or []):
                  print(v["id"])
                  break
          PYEOF
                     )"
              if [ -n "$VID" ]; then
                code="$(curl -s -o /dev/null -w '%{http_code}' -X DELETE \
                          -H 'Authorization: Bearer '"$TOKEN" \
                          "https://api.github.com/user/packages/container/${GITHUB_REPOSITORY#*/}/versions/$VID" || true)"
                echo "  deleted $INT (id=$VID) -> HTTP $code"
              else
                echo "  warning: $INT not found (already deleted, or the REST API requires credentials)"
                echo "  -> manual fallback: delete the dsh-int-* versions in the GHCR UI"
              fi
            done
          else
            echo "  warning: no GITHUB_TOKEN available — dsh-int-* versions left for manual cleanup"
          fi
