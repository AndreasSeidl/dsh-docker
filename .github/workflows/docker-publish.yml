# Build and publish the dsh container image to GHCR.
#
#   * On a git TAG (e.g. `v0.1.1-rc.2` or `0.1.1-rc.2`) → build the harness at
#     that upstream version and push
#       ghcr.io/<owner>/dsh-docker:<version>
#       ghcr.io/<owner>/dsh-docker:latest
#   * Every Monday 03:30 UTC → build the upstream default branch and push
#       ghcr.io/<owner>/dsh-docker:nightly   (keeps "latest source" rolling)
#   * Manually (workflow_dispatch, `version` input) → build any upstream
#     tag/commit and push <version>.
#
# Platforms: linux/amd64 by default (native, fast in CI). arm64 is opt-in — the
# `include_arm64` dispatch input or repo variable INCLUDE_ARM64=1 — and is a
# QEMU-emulated cross-build, which is slow: emulated node costs ~10-17s PER pnpm
# metadata request, so a cold arm64 run is ~1h. (Dockerfile step ordering/cache
# details for warm runs are documented in the recipe's README "Cache hygiene".)
name: docker-publish

on:
  push:
    tags: ['v*', '[0-9]*']
  schedule:
    - cron: '30 3 * * 1'
  workflow_dispatch:
    inputs:
      version:
        description: 'Upstream dsh version/tag to build (default: upstream default branch)'
        required: false
        default: ''
      include_arm64:
        description: 'Also build linux/arm64 (QEMU-emulated; slow). Defaults to the INCLUDE_ARM64 repo variable, else amd64 only.'
        type: boolean
        required: false
        default: false

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    # Long builds are the multi-arch case only; bound it so a job can never
    # sit for hours (QEMU arm64 cold build ~1h is the ceiling that matters).
    timeout-minutes: 150
    steps:
      - name: Checkout this repo (recipe + build scripts)
        uses: actions/checkout@v4

      - name: Resolve release version
        id: version
        run: |
          VERSION=""
          if [ "${{ github.event_name }}" = "push" ] && [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
            VERSION="${VERSION#v}"                 # accept both v0.1.1-rc.2 and 0.1.1-rc.2
          elif [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Resolve upstream ref
        id: upstream
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          if [ -n "$VERSION" ] \
             && git ls-remote --exit-code --refs \
                  https://github.com/deepseek-ai/deepseek-harness.git \
                  "refs/tags/$VERSION" >/dev/null 2>&1; then
            echo "ref=$VERSION"
          else
            echo "ref=master"
          fi | tee -a "$GITHUB_OUTPUT"

      - name: Checkout harness source
        uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: ${{ steps.upstream.outputs.ref }}
          path: upstream

      - name: Capture source commit
        id: commit
        run: echo "commit=$(git -C upstream rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Stage the build context
        run: DSH_SRC="$(pwd)/upstream" ./scripts/build-context.sh

      - name: Resolve platforms
        id: platforms
        run: |
          WANT=""
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            WANT="${{ inputs.include_arm64 }}"
          elif [ -n "${{ vars.INCLUDE_ARM64 }}" ]; then
            WANT="${{ vars.INCLUDE_ARM64 }}"
          fi
          if [ "$WANT" = "true" ] || [ "$WANT" = "1" ]; then
            echo "platforms=linux/amd64,linux/arm64" | tee -a "$GITHUB_OUTPUT"
          else
            echo "platforms=linux/amd64" | tee -a "$GITHUB_OUTPUT"
          fi

      - name: Set up QEMU (arm64 cross-build only)
        if: contains(steps.platforms.outputs.platforms, 'arm64')
        uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image and tags
        id: tags
        run: |
          # GHCR refs must be all-lowercase; github.repository keeps the owner's
          # case (e.g. AndreasSeidl/dsh-docker -> andreasseidl/dsh-docker), so
          # derive the image name via bash's @L lowercase expansion.
          IMG="ghcr.io/${GITHUB_REPOSITORY@L}"
          echo "image=$IMG" | tee -a "$GITHUB_OUTPUT"
          VERSION="${{ steps.version.outputs.version }}"
          if [ -n "$VERSION" ]; then
            # Full image refs: a bare "0.1.1-rc.2" would push to docker.io/library
            echo "tags=$IMG:$VERSION,$IMG:latest" | tee -a "$GITHUB_OUTPUT"
          else
            echo "tags=$IMG:nightly" | tee -a "$GITHUB_OUTPUT"
          fi

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .docker-context
          platforms: ${{ steps.platforms.outputs.platforms }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          # Warm-cache plumbing (keeps repeated/CI builds from being cold):
          #   * type=gha — GitHub Actions cache backend. SELF-MANAGING: GitHub
          #     caps it per repo (~10 GB for public repos) and evicts LRU and
          #     7-day-stale entries, so it cannot grow without bound the way a
          #     local BuildKit store can. mode=max stores intermediate layers so
          #     the builder stages (~90% of the compile cost) are reused, not
          #     just the final runtime image.
          #   * The registry buildcache (`<image>:buildcache`) that this workflow
          #     previously exported is intentionally gone: it is additive and has
          #     NO automatic size eviction, so it accumulated cache blobs on GHCR
          #     unboundedly — the registry analogue of a 100 GB local build cache.
          #     gha alone keeps builds warm within GitHub's enforced cache budget.
          cache-from: |
            type=gha
          cache-to: |
            type=gha,mode=max
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.description=DeepSeek Harness (dsh web) container
          build-args: |
            DSH_CLIENT_COMMIT_HASH=${{ steps.commit.outputs.commit }}
