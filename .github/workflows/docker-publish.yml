# Build and publish the dsh container image to GHCR.
#
# Publishes ONLY real upstream releases — there is deliberately NO `schedule`
# and no rolling "nightly" build. Every run resolves an exact upstream version
# and pushes
#   ghcr.io/<owner>/dsh-docker:<version>   (multi-arch, linux/amd64+arm64)
#   ghcr.io/<owner>/dsh-docker:latest      (alias for the newest release)
#
# * On a git TAG (e.g. `v0.1.1-rc.2` or `0.1.1-rc.2`) -> build the harness at
#   that upstream version. Upstream tags releases as `dsh-v<version>`; the
#   resolver accepts both the plain and prefixed forms so the tagged snapshot
#   is built, never master.
# * Manually (workflow_dispatch): with a `version` input, build that upstream
#   tag/commit; without one, resolve the NEWEST upstream release and build it
#   (so a "rebuild latest" is always a real release, never a default branch).
# * Reusable (workflow_call, `version` input) -> called by the hourly
#   check-upstream-release workflow when a newer upstream release appears.
#
# Native multi-arch (no QEMU) — structure adapted from
# sredevopsorg/multi-arch-docker-github-workflow (MIT, (c) 2025 SREDevOps.org;
# see also the "Attribution" note in CONTRIBUTING): a matrix of two builds
# (amd64 on ubuntu-latest, arm64 on the ubuntu-24.04-arm hosted ARM runner)
# each push their per-arch image to GHCR **BY DIGEST with no tag**
# (`outputs: type=image,name=…,push-by-digest=true,name-canonical=true`) and
# upload the digest as a tiny artifact. The `merge` job downloads both digests
# and creates the published multi-arch index from the raw digests (`docker
# buildx imagetools create …  ghcr.io/…@sha256:…`), tags `<version>` + `latest`,
# then VERIFIES the result (both platform manifests reachable + the amd64 leg
# runs).
#
# Because the per-arch owners are pushed WITHOUT a tag, they stay **untagged**
# versions on GHCR — searchable by digest, never shown among tagged releases —
# so there are no throwaway tags anywhere. They still must NEVER be
# version-deleted: GHCR's version deletion is not reference-aware and removes
# the platform manifest the merged index points at, leaving
# `<version>`/`latest` un-pullable (`manifest not found`, seen on
# 0.1.2-alpha.2 / `:latest`). The untagged owner rows accumulate per release;
# that is the intrinsic price of native multi-arch on GHCR.
name: docker-publish

on:
  push:
    tags: ['v*', '[0-9]*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Upstream dsh version/tag to build (empty = newest upstream release; never nightly)'
        required: false
        default: ''
  # Reusable entry point: check-upstream-release.yml calls this with an explicit
  # upstream version whenever an hourly poll finds a newer release. `version` is
  # mirrored from workflow_dispatch, so the resolution steps below work for
  # both entry points unchanged.
  workflow_call:
    inputs:
      version:
        description: 'Upstream dsh version/tag to build'
        required: false
        type: string

permissions:
  contents: read
  packages: write

concurrency:
  # One publish at a time per ref; a newer trigger cancels the in-flight one so
  # parallel dispatches/poll ticks cannot race the same tags on GHCR.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - name: Checkout this repo (recipe + build scripts)
        uses: actions/checkout@v4

      - name: Resolve release version
        id: version
        run: |
          VERSION=""
          if [ "${{ github.event_name }}" = "push" ] && [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
            VERSION="${VERSION#v}"                 # accept both v0.1.1-rc.2 and 0.1.1-rc.2
          elif [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            # Manual dispatch with no version: build the newest upstream
            # release (what the poller would have picked), so there is never a
            # "nightly" (rolling default-branch) publish.
            VERSION="$(git ls-remote --refs --tags \
                         https://github.com/deepseek-ai/deepseek-harness.git \
                         'refs/tags/dsh-v*' \
                         | sed 's#.*refs/tags/dsh-v##; s/\^{}//' | sort -V | tail -1)"
            echo "note: no version given - resolved newest upstream release: ${VERSION:-<none>}"
          fi
          [ -n "$VERSION" ] || { echo "error: could not resolve an upstream version to build" >&2; exit 1; }
          # Supported-version floor (see .supported-version / CONTRIBUTING.md):
          # refuse to publish any upstream version below it, so fixes and
          # features never have to be backwards-compatible with older releases.
          MIN_SUPPORTED="$(grep -m1 -E '^[0-9]' .supported-version 2>/dev/null | tr -d '[:space:]' || true)"
          [ -n "$MIN_SUPPORTED" ] || { echo "error: .supported-version missing or unreadable" >&2; exit 1; }
          if [ "$(printf '%s\n%s\n' "$VERSION" "$MIN_SUPPORTED" | sort -V | tail -n1)" = "$VERSION" ]; then
            echo "version $VERSION >= supported floor $MIN_SUPPORTED"
          else
            echo "error: refusing to publish $VERSION (below the supported floor $MIN_SUPPORTED)" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "min_supported=$MIN_SUPPORTED" >> "$GITHUB_OUTPUT"

      - name: Resolve upstream ref
        id: upstream
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Upstream tags releases as dsh-v<version> (e.g. dsh-v0.1.2-alpha.2).
          # Try the plain and prefixed forms so a container tag (v0.1.2-alpha.2
          # or 0.1.2-alpha.2) resolves to the REAL release snapshot instead of
          # silently falling back to master (which used to mislabel the
          # published images).
          REF=""
          for candidate in "refs/tags/$VERSION" "refs/tags/dsh-v$VERSION"; do
            if git ls-remote --exit-code --refs \
                 https://github.com/deepseek-ai/deepseek-harness.git \
                 "$candidate" >/dev/null 2>&1; then
              REF="${candidate#refs/tags/}"
              break
            fi
          done
          [ -n "$REF" ] || REF="master"
          echo "ref=$REF" | tee -a "$GITHUB_OUTPUT"

      - name: Checkout harness source
        uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: ${{ steps.upstream.outputs.ref }}
          path: upstream

      - name: Capture source commit
        id: commit
        run: echo "commit=$(git -C upstream rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Stage the build context
        run: DSH_SRC="$(pwd)/upstream" ./scripts/build-context.sh

      - name: Prepare platform pair name (for artifact naming)
        run: echo "PLATFORM_PAIR=linux-${{ matrix.arch }}" >> "$GITHUB_ENV"

      # Native per-arch builds — no QEMU setup needed on either runner.
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image name
        id: image
        run: |
          # GHCR refs must be all-lowercase; github.repository keeps the owner's
          # case (e.g. AndreasSeidl/dsh-docker -> andreasseidl/dsh-docker), so
          # derive it via bash's @L lowercase expansion.
          echo "image=ghcr.io/${GITHUB_REPOSITORY@L}" | tee -a "$GITHUB_OUTPUT"

      - name: Build and push by digest (linux/${{ matrix.arch }})
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .docker-context
          platforms: linux/${{ matrix.arch }}
          # push by DIGEST with NO tag: the per-arch image lands on GHCR as an
          # untagged, content-addressed version (searchable by digest, never
          # shown among tagged releases). The merge job joins the raw digests.
          outputs: type=image,name=${{ steps.image.outputs.image }},push-by-digest=true,name-canonical=true,push=true,oci-mediatypes=true
          # Warm-cache plumbing. type=gha is SELF-MANAGING: GitHub caps it per
          # repo (~10 GB for public repos) and evicts LRU / 7-day-stale entries,
          # so it cannot grow without bound. Per-arch scope keeps amd64/arm64
          # caches independent. mode=max stores intermediate layers so the
          # builder stages (~90% of the compile cost) are reused. No registry
          # buildcache: it is additive with no size eviction (the unbounded
          # analogue of a 100 GB local build cache) — see README "Cache hygiene".
          cache-from: type=gha,scope=dsh-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=dsh-${{ matrix.arch }}
          # Disable BuildKit's default SLSA provenance/SBOM attestations: they
          # are pushed as extra index entries with no os/arch and show up as
          # "unknown/unknown" platforms in UIs and `manifest inspect` (and
          # pinning by their digest yields a non-runnable stub). We don't need
          # the attestation metadata here, so keep the published index clean:
          # only the two real platform images.
          provenance: false
          sbom: false
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.description=DeepSeek Harness (dsh web) container
          build-args: |
            DSH_CLIENT_COMMIT_HASH=${{ steps.commit.outputs.commit }}

      - name: Export digest
        run: |
          # One empty file per built image, named by its digest — uploaded and
          # re-globbed in the merge job so the two digests cross the job
          # boundary without matrix-output plumbing.
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: merge multi-arch manifest (verify)
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout this repo (supported-version floor)
        uses: actions/checkout@v4

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v3

      - name: Compute image and target
        id: meta
        run: |
          IMG="ghcr.io/${GITHUB_REPOSITORY@L}"
          echo "image=$IMG" >> "$GITHUB_OUTPUT"
          # Always the build job's resolved version (it applies the newest-
          # upstream fallback for an empty manual dispatch), never "nightly".
          echo "target=${{ needs.build.outputs.version }}" >> "$GITHUB_OUTPUT"

      - name: Create multi-arch manifest and verify
        env:
          IMG: ${{ steps.meta.outputs.image }}
          TARGET: ${{ steps.meta.outputs.target }}
        run: |
          set -u
          shopt -s nullglob

          # --- 1) merge ---
          # Reassemble the per-arch images from the digests the build job
          # uploaded (file names are the bare sha256 hex digests).
          cd /tmp/digests
          files=(*)
          [ "${#files[@]}" -gt 0 ] || { echo "no per-arch digests found" >&2; exit 1; }
          REFS=""
          for d in "${files[@]}"; do REFS="$REFS $IMG@sha256:$d"; done
          echo "merging:$REFS"
          # Every publish is a real (versioned) release; `latest` aliases the
          # newest one. Neither is ever "nightly". Index annotations mirror the
          # reference workflow's provenance niceties.
          docker buildx imagetools create \
            -t "$IMG:$TARGET" -t "$IMG:latest" \
            --annotation 'index:org.opencontainers.image.description=DeepSeek Harness (dsh web) container' \
            --annotation "index:org.opencontainers.image.created=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            --annotation "index:org.opencontainers.image.url=${{ github.server_url }}/${{ github.repository }}" \
            --annotation "index:org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}" \
            $REFS \
            || { echo "merge failed" >&2; exit 1; }
          echo "published $IMG:$TARGET + $IMG:latest"

          # --- 2) verify the published tags resolve to real content ---
          # Resolve every platform manifest the fresh index references. This is
          # exactly the check that would have caught the 0.1.2-alpha.2 failure
          # (index present, platform content gone). `--verbose` forces docker
          # to fetch each child manifest, not just the index.
          echo "== verifying published tags resolve to real content =="
          for REF in "$IMG:$TARGET" "$IMG:latest"; do
            docker manifest inspect --verbose "$REF" >/dev/null \
              || { echo "FATAL: $REF references unreachable platform content" >&2; exit 1; }
            echo "  $REF: both platform manifests reachable"
          done
          echo "== verifying per-arch digests are present =="
          for d in "${files[@]}"; do
            docker manifest inspect --verbose "$IMG@sha256:$d" >/dev/null 2>&1 \
              || { echo "FATAL: owner digest sha256:$d unreachable" >&2; exit 1; }
            echo "  sha256:$d reachable"
          done
          # Full smoke on the host architecture — the same path `docker compose
          # up` takes. (arm64 can't *execute* on an amd64 runner, but its
          # manifest was just verified reachable above.) Also assert the image
          # reports a harness version at or above the supported floor.
          BOT="$(docker run --rm --platform linux/amd64 "$IMG:$TARGET" --version 2>/dev/null | head -n1 | tr -d '[:space:]' || true)"
          [ -n "$BOT" ] || { echo "FATAL: published image does not run / report a version" >&2; exit 1; }
          MIN_SUPPORTED="$(grep -m1 -E '^[0-9]' .supported-version 2>/dev/null | tr -d '[:space:]' || true)"
          if [ "$(printf '%s\n%s\n' "$BOT" "$MIN_SUPPORTED" | sort -V | tail -n1)" = "$BOT" ]; then
            echo "  verified: $IMG:$TARGET pulls/runs (amd64), reports $BOT >= floor ${MIN_SUPPORTED:-<missing>}"
          else
            echo "FATAL: published image reports $BOT, below the supported floor $MIN_SUPPORTED" >&2
            exit 1
          fi

          # The untagged per-arch owners backing this tag are left in place
          # forever: GHCR has no tag-removal API, and version-deleting an owner
          # breaks this freshly published tag (see the file header).
          echo "published $IMG:$TARGET + $IMG:latest (owners kept as untagged digests)"
