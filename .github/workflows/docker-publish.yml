# Build and publish the dsh container image to GHCR.
#
#   * On a git TAG (e.g. `v0.1.1-rc.2` or `0.1.1-rc.2`) → build the harness at
#     that upstream version and push
#       ghcr.io/<owner>/dsh-docker:<version>   (multi-arch, linux/amd64+arm64)
#       ghcr.io/<owner>/dsh-docker:latest
#     Upstream tags releases as `dsh-v<version>`; the resolver accepts both the
#     plain and prefixed forms so the tagged snapshot is built, never master.
#   * Every Monday 03:30 UTC → build the upstream default branch and push
#       ghcr.io/<owner>/dsh-docker:nightly   (keeps "latest source" rolling)
#   * Manually (workflow_dispatch, `version` input) → build any upstream
#     tag/commit and push <version>.
#
# NATIVE multi-arch: two matrix jobs build linux/amd64 (ubuntu-latest) and
# linux/arm64 (ubuntu-24.04-arm hosted ARM runner) natively — no QEMU, so the
# arm64 leg is as fast as amd64 (QEMU cross-building once cost ~1 h of emulated
# pnpm/tsc on a cold run). Each platform pushes a per-arch intermediate tag
# (`<version>-<arch>`); the `merge` job joins them into the final multi-arch
# manifest with `docker buildx imagetools create`.
name: docker-publish

on:
  push:
    tags: ['v*', '[0-9]*']
  schedule:
    - cron: '30 3 * * 1'
  workflow_dispatch:
    inputs:
      version:
        description: 'Upstream dsh version/tag to build (default: upstream default branch)'
        required: false
        default: ''

permissions:
  contents: read
  packages: write

jobs:
  build:
    name: build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - name: Checkout this repo (recipe + build scripts)
        uses: actions/checkout@v4

      - name: Resolve release version
        id: version
        run: |
          VERSION=""
          if [ "${{ github.event_name }}" = "push" ] && [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
            VERSION="${VERSION#v}"                 # accept both v0.1.1-rc.2 and 0.1.1-rc.2
          elif [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Resolve upstream ref
        id: upstream
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          # Upstream tags releases as dsh-v<version> (e.g. dsh-v0.1.2-alpha.1).
          # Try the plain and prefixed forms so a container tag (v0.1.2-alpha.1
          # or 0.1.2-alpha.1) resolves to the REAL release snapshot instead of
          # silently falling back to master (which used to mislabel the
          # published images).
          REF=""
          for candidate in "refs/tags/$VERSION" "refs/tags/dsh-v$VERSION"; do
            if git ls-remote --exit-code --refs \
                 https://github.com/deepseek-ai/deepseek-harness.git \
                 "$candidate" >/dev/null 2>&1; then
              REF="${candidate#refs/tags/}"
              break
            fi
          done
          [ -n "$REF" ] || REF="master"
          echo "ref=$REF" | tee -a "$GITHUB_OUTPUT"

      - name: Checkout harness source
        uses: actions/checkout@v4
        with:
          repository: deepseek-ai/deepseek-harness
          ref: ${{ steps.upstream.outputs.ref }}
          path: upstream

      - name: Capture source commit
        id: commit
        run: echo "commit=$(git -C upstream rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Stage the build context
        run: DSH_SRC="$(pwd)/upstream" ./scripts/build-context.sh

      # Native per-arch builds — no QEMU setup needed on either runner.
      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image and tags
        id: tags
        run: |
          # GHCR refs must be all-lowercase; github.repository keeps the owner's
          # case (e.g. AndreasSeidl/dsh-docker -> andreasseidl/dsh-docker), so
          # derive it via bash's @L lowercase expansion.
          IMG="ghcr.io/${GITHUB_REPOSITORY@L}"
          echo "image=$IMG" | tee -a "$GITHUB_OUTPUT"
          VERSION="${{ steps.version.outputs.version }}"
          TARGET="$VERSION"
          [ -n "$TARGET" ] || TARGET="nightly"
          echo "target=$TARGET" | tee -a "$GITHUB_OUTPUT"
          # Per-arch intermediate tag; the merge job joins these into the final
          # manifest. Bare refs would push to docker.io/library, so always full.
          echo "perarch_tags=$IMG:$TARGET-${{ matrix.arch }}" | tee -a "$GITHUB_OUTPUT"

      - name: Build and push (linux/${{ matrix.arch }})
        uses: docker/build-push-action@v6
        with:
          context: .docker-context
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ steps.tags.outputs.perarch_tags }}
          # Warm-cache plumbing. type=gha is SELF-MANAGING: GitHub caps it per
          # repo (~10 GB for public repos) and evicts LRU / 7-day-stale entries,
          # so it cannot grow without bound. Per-arch scope keeps amd64/arm64
          # caches independent. mode=max stores intermediate layers so the
          # builder stages (~90% of the compile cost) are reused. No registry
          # buildcache: it is additive with no size eviction (the unbounded
          # analogue of a 100 GB local build cache) — see README "Cache hygiene".
          cache-from: type=gha,scope=dsh-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=dsh-${{ matrix.arch }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ steps.version.outputs.version }}
            org.opencontainers.image.description=DeepSeek Harness (dsh web) container
          build-args: |
            DSH_CLIENT_COMMIT_HASH=${{ steps.commit.outputs.commit }}

  merge:
    name: merge multi-arch manifest
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Compute image and target
        id: meta
        run: |
          IMG="ghcr.io/${GITHUB_REPOSITORY@L}"
          VERSION=""
          if [ "${{ github.event_name }}" = "push" ] && [[ "$GITHUB_REF" == refs/tags/* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
            VERSION="${VERSION#v}"
          elif [ -n "${{ inputs.version }}" ]; then
            VERSION="${{ inputs.version }}"
          fi
          TARGET="$VERSION"
          [ -n "$TARGET" ] || TARGET="nightly"
          echo "image=$IMG" >> "$GITHUB_OUTPUT"
          echo "target=$TARGET" >> "$GITHUB_OUTPUT"

      - name: Create combined multi-arch manifest
        env:
          IMG: ${{ steps.meta.outputs.image }}
          TARGET: ${{ steps.meta.outputs.target }}
        run: |
          set -euo pipefail
          ARCH_TAGS=""
          for a in amd64 arm64; do
            if docker buildx imagetools inspect "$IMG:$TARGET-$a" >/dev/null 2>&1; then
              ARCH_TAGS="$ARCH_TAGS $IMG:$TARGET-$a"
            else
              echo "warning: missing $IMG:$TARGET-$a — skipping"
            fi
          done
          [ -n "$ARCH_TAGS" ] || { echo "no per-arch images to merge" >&2; exit 1; }
          FINAL_TAGS="-t $IMG:$TARGET"
          [ "$TARGET" = "nightly" ] || FINAL_TAGS="$FINAL_TAGS -t $IMG:latest"
          docker buildx imagetools create $FINAL_TAGS $ARCH_TAGS
          echo "published $IMG:$TARGET (${TARGET#latest} tags set)"
