# Poll every upstream release, including older gaps left by failed publishes.
# Supported releases are bounded by .supported-version. GHCR tags are paginated.
# Dispatch one batch: separate dispatches would compete for publish concurrency.
name: check-upstream-release

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: check-upstream-release
  cancel-in-progress: false

jobs:
  check:
    name: Diff all supported upstream releases vs published versions
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      build_needed: ${{ steps.diff.outputs.build_needed }}
      versions: ${{ steps.diff.outputs.versions }}
    steps:
      - uses: actions/checkout@v5
      - name: Discover all missing supported releases
        id: diff
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/release-versions.py --version missing --check

  publish:
    name: Dispatch missing release batch
    needs: check
    if: needs.check.outputs.build_needed == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Dispatch docker-publish once for all missing releases
        env:
          GH_TOKEN: ${{ github.token }}
          VERSIONS: ${{ needs.check.outputs.versions }}
        run: gh workflow run docker-publish.yml --repo "${{ github.repository }}" --ref main --field version="$VERSIONS"
