# Auto-publish when upstream releases a new version.
#
# Upstream (deepseek-ai/deepseek-harness) tags every release as `dsh-v<ver>`
# (e.g. dsh-v0.1.2-alpha.2), always as a PRERELEASE in the current cycle, so
# GitHub's "latest release" API returns nothing and we cannot watch a "latest
# stable release". This workflow therefore polls directly:
#
#   1. every hour (17 min past, to spread load) list ALL upstream release tags
#      `refs/tags/dsh-v*`;
#   2. list the version tags already published on GHCR;
#   3. if the newest upstream tag is not yet published (and no per-arch build of
#      it is in flight), call the docker-publish workflow with that exact
#      version — it builds both archs natively and pushes `<version>` + `latest`.
#
# When there is nothing new the run is ONE tiny check job (a git ls-remote +
# a small registry query, a few seconds of runner time) — no build is started.
# Only a genuinely new upstream release tag triggers the expensive multi-arch
# build, and never twice: a per-arch in-flight tag (`<version>-amd64`) is
# treated as "already on it". Runs on the default branch; `workflow_dispatch`
# lets you force a re-check without waiting for the hour.
name: check-upstream-release

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  # Resolving the `uses:` reusable workflow requires actions read permission.
  actions: read

jobs:
  check:
    name: Diff upstream releases vs published versions
    runs-on: ubuntu-latest
    outputs:
      build_needed: ${{ steps.diff.outputs.build_needed }}
      version: ${{ steps.diff.outputs.version }}
    steps:
      - name: Discover new upstream release not yet published
        id: diff
        env:
          PKG: ${{ github.repository }}
        run: |
          set -euo pipefail
          LOWER="${PKG,,}"                            # owner/name lowercase (GHCR)
          REPO="deepseek-ai/deepseek-harness"

          echo "== upstream release tags (dsh-v*) =="
          UP="$(git ls-remote --refs --tags "https://github.com/$REPO.git" 'refs/tags/dsh-v*' \
                  | sed 's#.*refs/tags/dsh-v##; s/\^{}//' | sort -V | tail -1)"
          echo "newest upstream: ${UP:-<none>}"

          echo "== tags currently on GHCR =="
          # Public package -> anonymous pull-scope token is enough, no repo token.
          TOKEN="$(curl -fsS "https://ghcr.io/token?scope=repository:${LOWER}:pull" \
                     | python3 -c 'import sys,json;print(json.load(sys.stdin)["token"])')"
          curl -fsS -H "Authorization: Bearer $TOKEN" \
               "https://ghcr.io/v2/${LOWER}/tags/list?n=500" > tags.json

          # Build iff the newest upstream tag is not already published and no
          # per-arch build of it is in flight.
          BUILD="$(python3 - "$UP" <<'PYEOF'
          import json, sys
          up = sys.argv[1]
          tags = json.load(open("tags.json")).get("tags", [])
          published, inflight = set(), set()
          for t in tags:
              if t.endswith(("-amd64", "-arm64")):
                  inflight.add(t[:-6])          # a <ver>-amd64 tag = build of <ver> running
              elif t not in ("latest", "nightly"):
                  published.add(t)
          print("true" if up and up not in published and up not in inflight else "false")
          PYEOF
          )"
          if [ "$BUILD" = "true" ]; then
            echo "build_needed=true"  >> "$GITHUB_OUTPUT"
            echo "version=$UP"        >> "$GITHUB_OUTPUT"
            echo "-> building upstream release $UP"
          else
            echo "build_needed=false" >> "$GITHUB_OUTPUT"
            echo "-> nothing new to publish"
          fi

  publish:
    name: Publish ${{ needs.check.outputs.version }}
    needs: check
    if: needs.check.outputs.build_needed == 'true'
    uses: ./.github/workflows/docker-publish.yml
    with:
      version: ${{ needs.check.outputs.version }}
