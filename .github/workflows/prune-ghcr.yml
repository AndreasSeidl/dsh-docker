# One-off GHCR housekeeping: delete rows that are NOT real version releases.
#
# Removed: `nightly` (retired in the version-only publish redesign) and the
# throwaway `dsh-int-*` per-arch build tags (and any <ver>-amd64/-arm64 rows).
# A row that carries ANY real version tag (0.1.x… or `latest`) is always kept —
# in particular `latest` shares the newest version's manifest, so it can never
# be pruned without deleting that version too.
#
# Use it right after this change lands to clear the pre-existing nightly and
# dsh-int-* rows, and later for any leftovers the in-workflow cleanup missed.
# `dry_run: true` only lists what would be deleted. It is also a self-test of
# whether GITHUB_TOKEN can delete package versions at all (the REST DELETE
# prints its HTTP code; 204 = success).
name: prune-ghcr

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Only list what would be deleted, do not delete'
        required: false
        default: 'false'

permissions:
  contents: read
  packages: write

jobs:
  prune:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Collect non-version rows
        id: collect
        env:
          PKG: ${{ github.repository }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          curl -sS --max-time 20 -H "Authorization: Bearer $TOKEN" \
            "https://api.github.com/user/packages/container/${PKG#*/}/versions?per_page=100" -o versions.json
          python3 <<'PYEOF' > garbage.txt
          import json
          garbage = {"latest", "nightly"}
          for v in json.load(open("versions.json")):
              tags = v.get("metadata", {}).get("container", {}).get("tags") or []
              nonversion = [t for t in tags if t in garbage or t.startswith("dsh-int-") or t.endswith(("-amd64", "-arm64"))]
              keepver    = [t for t in tags if t not in nonversion]
              if nonversion and not keepver:
                  print(f'DELETE {v["id"]} ({",".join(tags) or "untagged"})')
          PYEOF
          echo "candidates: $(grep -c '^DELETE' garbage.txt || true)"
          cat garbage.txt

      - name: Delete (unless dry run)
        if: ${{ inputs.dry_run != 'true' }}
        env:
          PKG: ${{ github.repository }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          deleted=0
          while read -r line; do
            id="${line#DELETE }"; id="${id%% *}"
            [ -n "$id" ] || continue
            code="$(curl -sS -o /dev/null -w '%{http_code}' --max-time 20 -X DELETE \
                      -H 'Authorization: Bearer '"$TOKEN" \
                      "https://api.github.com/user/packages/container/${PKG#*/}/versions/$id" || true)"
            echo "delete $id -> HTTP $code"
            [ "$code" = "204" ] && deleted=$((deleted + 1))
          done < garbage.txt
          echo "deleted $deleted version row(s)"
