# One "after-commit" stage for the repo: docs floor sync, then the image
# hygiene gate, then a conditional republish of every supported version.
#
# This workflow replaces the old image-hygiene.yml + docs-supported-version.yml
# and folds in the recipe-change publish trigger. Order is deliberate:
#   1. docs-sync        — regenerate the README supported-version floor and
#                         commit it back ([skip ci]) BEFORE anything else;
#   2. guard            — build the image once (amd64, cached, no push) and
#                         assert the agent-CLI purge still holds and /app is
#                         under the size ceiling. This is the gate;
#   3. publish-recipes  — ONLY on a push to main that changed image-affecting
#                         files AND a green guard: dispatch docker-publish with
#                         `version: all` (re-publish every GHCR tag at/above
#                         the supported floor with the new recipe, relabel
#                         `latest`).
#
# Git tags deliberately do NOT trigger anything anymore — releases are driven
# by upstream (check-upstream-release), recipe changes (this workflow's
# publish-recipes), and manual dispatch.
#
# The PR trigger is retained on purpose: the guard runs pre-merge, so a broken
# or bloated recipe is caught before it ever reaches main (and before
# publish-recipes could fan out into N×2 failing builds).
name: main-check

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# contents: write is needed for the docs auto-commit; actions: read is the
# minimum the runner requires. The recipe-driven re-publish is DISPATCHED
# rather than called via a reusable `uses:` (see the NOTE on publish-recipes),
# so this workflow needs no packages scope; the dispatch job raises its own
# scope to actions: write.
permissions:
  contents: write
  actions: read

jobs:
  # Which parts of this run are relevant, based on the files the event touched.
  # dorny/paths-filter diffs the trigger against the base and sets the two
  # booleans the dependent jobs branch on.
  paths:
    runs-on: ubuntu-latest
    outputs:
      image: ${{ steps.filter.outputs.image }}
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - id: filter
        uses: dorny/paths-filter@v4
        with:
          # Push → diff the pushed range; PR → diff against the merge base;
          # manual dispatch has no range, so diff against main (over-triggers
          # on a manual run are harmless).
          base: ${{ github.event_name == 'workflow_dispatch' && 'main' || '' }}
          filters: |
            image:
              - 'Dockerfile'
              - 'container/**'
              - 'scripts/build-context.sh'
            docs:
              - '.supported-version'
              - 'README.md'
              - 'CONTRIBUTING.md'
              - 'scripts/sync-supported-version.sh'

  # 1) Docs floor sync — self-healing, on pushes only. Auto-commits with a
  #    [skip ci] trailer so the bot commit never re-triggers anything. (The PR
  #    counterpart is docs-check below, a plain drift assertion.)
  docs-sync:
    needs: paths
    if: needs.paths.outputs.docs == 'true' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Regenerate the README floor from .supported-version
        run: ./scripts/sync-supported-version.sh
      - name: Commit the synced README when it drifted
        run: |
          git diff --quiet README.md && { echo "README already in sync — nothing to commit"; exit 0; }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "docs: sync supported-version floor into README [skip ci]"
          git push

  docs-check:
    needs: paths
    if: needs.paths.outputs.docs == 'true' && github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Verify README floor matches .supported-version
        run: ./scripts/sync-supported-version.sh --check

  # 2) The guard gate — build once, assert, don't push. Runs pre-merge on PRs
  #    and post-merge on main whenever the image-affecting files changed.
  #    `always() &&` makes it run after docs-sync regardless of docs outcome,
  #    so a docs-commit hiccup never blocks the image gate.
  guard:
    needs: [paths, docs-sync]
    if: always() && needs.paths.outputs.image == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      # Bytes of the /app tree (du -sb /app, measured inside the image — immune
      # to layer-import/remote-cache size reporting). Fixed image: ~455 MB; if
      # the agent-CLI purge silently stops matching, this jumps to ~1015 MB.
      # 650 MB is comfortable headroom for legitimate growth yet far below the
      # failure mode. Raise it only as a deliberate, documented decision.
      SIZE_CEILING_BYTES: '650000000'
    steps:
      - name: Checkout this repo (recipe + build scripts)
        uses: actions/checkout@v5

      - name: Resolve upstream ref
        id: upstream
        run: |
          # Prefer the newest released upstream tag over the default branch so
          # the guard exercises a real release snapshot when one exists. Upstream
          # tags releases as `dsh-v<version>` — the ref handed to checkout below
          # MUST keep that prefix (a bare version is not a ref in that repo).
          VERSION="$(git ls-remote --refs --tags \
                       https://github.com/deepseek-ai/deepseek-harness.git \
                       'refs/tags/dsh-v*' \
                       | sed 's#.*refs/tags/dsh-v##; s/\^{}//' | sort -V | tail -1 || true)"
          if [ -n "$VERSION" ]; then
            REF="dsh-v${VERSION}"
          else
            REF="master"
          fi
          echo "ref=$REF" | tee -a "$GITHUB_OUTPUT"
          # Plain version (no dsh-v prefix) — empty on the master fallback —
          # for the registry buildcache ref below.
          echo "version=$VERSION" | tee -a "$GITHUB_OUTPUT"

      - name: Checkout harness source
        uses: actions/checkout@v5
        with:
          repository: deepseek-ai/deepseek-harness
          ref: ${{ steps.upstream.outputs.ref }}
          path: upstream

      - name: Capture source commit
        id: commit
        run: echo "commit=$(git -C upstream rev-parse --short=7 HEAD)" >> "$GITHUB_OUTPUT"

      - name: Stage the build context
        run: DSH_SRC="$(pwd)/upstream" ./scripts/build-context.sh

      - name: Compute image name
        id: image
        # GHCR refs must be all-lowercase (github.repository keeps the owner's
        # case), so derive it via bash's @L expansion — that only works inside
        # a run step, not in action-input expressions.
        run: echo "image=ghcr.io/${GITHUB_REPOSITORY@L}" | tee -a "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v4

      - name: Build (linux/amd64, no push)
        uses: docker/build-push-action@v7
        with:
          context: .docker-context
          platforms: linux/amd64
          push: false
          load: true
          tags: dsh-main-check:check
          # Read-only caches. gha (independent scope from the publish lanes)
          # harvests old entries until GitHub evicts them (LRU / 7-day stale);
          # the NEWEST version's registry buildcache from the last publish
          # warms the base + install/compile layers, so a guard re-check of an
          # already-published version replays instead of recompiling. Nothing
          # is WRITTEN: gha cache export has proven to hang on this repo (see
          # the docker-publish build job), and a PR gate is the last place to
          # risk that. When the newest version is unknown (master fallback) the
          # registry ref resolves to '' and is dropped; only gha is read.
          cache-from: |
            type=gha,scope=dsh-guard-amd64
            ${{ steps.upstream.outputs.version && format('type=registry,ref={0}:buildcache-{1}-amd64', steps.image.outputs.image, steps.upstream.outputs.version) || '' }}
          provenance: false
          sbom: false
          build-args: |
            DSH_CLIENT_COMMIT_HASH=${{ steps.commit.outputs.commit }}

      - name: Assert agent-CLI platform packages are gone
        run: |
          LEFT="$(docker run --rm --entrypoint /bin/sh dsh-main-check:check -c \
            'find /app/node_modules/.pnpm -maxdepth 1 -type d \( \
               -name "@anthropic-ai+claude-agent-sdk-linux-*@*" \
               -o -name "@openai+codex@*-linux-*" \
               -o -name "@openai+codex-linux-*@*" \) -print 2>/dev/null' )"
          if [ -n "$LEFT" ]; then
            echo "agent-CLI platform packages survived the purge:"
            echo "$LEFT"
            echo "The harness renamed/changed these packages — update the purge"
            echo "globs in the Dockerfile (DSH_INCLUDE_AGENT_CLIS=0 default)." >&2
            exit 1
          fi
          echo "OK: no agent-CLI platform packages in the final image"

      - name: Assert image size is under the ceiling
        env:
          CEILING: ${{ env.SIZE_CEILING_BYTES }}
        run: |
          # du -sb /app inside the image: deterministic, independent of how the
          # image was loaded/cached on this runner.
          APP_BYTES="$(docker run --rm --entrypoint /bin/sh dsh-main-check:check -c 'du -sb /app | cut -f1')"
          echo "app tree: ${APP_BYTES} B (ceiling ${CEILING} B)"
          if [ -z "$APP_BYTES" ] || [ "$APP_BYTES" -gt "$CEILING" ]; then
            echo "App tree is ${APP_BYTES:-unknown} B — over the ${CEILING} B ceiling." >&2
            echo "Find what was pulled in, or raise the ceiling deliberately in" >&2
            echo ".github/workflows/main-check.yml." >&2
            exit 1
          fi

  # 3) Recipe-change publish: a merged push to main that touched image-affecting
  #    files AND passed the guard re-publishes every supported GHCR version with
  #    the new recipe. Never fires on PRs, never fires on a red/absent guard.
  #
  # NOTE (2026-09-03): this used to call docker-publish via `uses:` with an
  # `if:` referencing needs.<job>.outputs. GitHub silently SKIPPED the job even
  # though the condition was true (paths-filter reported image=true in run
  # 33749065416) — needs* context on a job that calls a reusable workflow is
  # unreliable (actions/runner#2495/#3087/#1661; shiv-source/thoth#61). Since
  # guard already only runs when image changed, a green guard on a push is
  # sufficient; the decision is now evaluated on this plain job (needs on a
  # normal job is reliable, exactly like guard's own `if`) and docker-publish is
  # DISPATCHED as a separate run instead of being called as a reusable workflow.
  publish-recipes:
    needs: [guard]
    if: github.event_name == 'push' && needs.guard.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: write   # to dispatch docker-publish below
    steps:
      - name: Re-publish every supported GHCR version with the new recipe
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh workflow run docker-publish.yml
          --repo "${{ github.repository }}"
          --ref "${{ github.ref_name }}"
          --field version=all
